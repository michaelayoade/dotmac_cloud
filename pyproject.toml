[project]
name = "dotmac-cloud"
version = "0.1.0a0"
description = "Independent Dotmac Cloud product assembly"
authors = [{ name = "Dotmac" }]
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = []
classifiers = ["Private :: Do Not Upload"]

[tool.poetry]
packages = [{ include = "dotmac_cloud", from = "src" }]
include = [
  { path = "src/dotmac_cloud/cloud_v1_bom.json", format = ["sdist", "wheel"] },
]
requires-poetry = "2.4.1"

[tool.poetry.group.dev.dependencies]
mypy = "^1.13"
pytest = "^8.3"
pytest-cov = "^6.0"
ruff = "^0.8"

[build-system]
requires = ["poetry-core>=1.9"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
