name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**", "chore/**"]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

# Read-only credentials for the private Dotmac index, which resolves the exact
# `dotmac-kernel` pin. `ci-reader` holds read:package and nothing else; the
# value lives only in repository secrets and is never printed.
env:
  POETRY_HTTP_BASIC_FORGEJO_USERNAME: ci-reader
  POETRY_HTTP_BASIC_FORGEJO_PASSWORD: ${{ secrets.FORGEJO_READ_TOKEN }}

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          [
            poetry-lock-check,
            lint,
            format-check,
            type-check,
            test,
            readiness-report,
          ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: ./.github/actions/setup-poetry
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('poetry.lock') }}
      - run: '[ -d .venv ] || python -m venv .venv'
      - run: poetry install
      - run: make ${{ matrix.target }}

  postgres:
    name: PostgreSQL migration and tenant isolation
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cloud_test
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cloud_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DOTMAC_CLOUD_MIGRATION_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/cloud_test
      TEST_MIGRATION_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/cloud_test
      TEST_DATABASE_URL: postgresql+psycopg://app_user:app_user@localhost:5432/cloud_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: ./.github/actions/setup-poetry
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('poetry.lock') }}
      - run: '[ -d .venv ] || python -m venv .venv'
      - run: poetry install
      - name: Create the restricted online role
        env:
          PGPASSWORD: postgres
        run: >-
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d cloud_test
          -c "CREATE ROLE app_user LOGIN PASSWORD 'app_user'
          NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS"
      - name: Rehearse both composed migration lineages
        # TWO lineages now share one revision graph: the kernel base lineage
        # from the exact-pinned distribution and this assembly's own. `heads`
        # (plural) applies both; the round trip unwinds them branch by branch,
        # assembly first, because `ca_0001_receipts` declares `depends_on` the
        # kernel root that creates the role it grants on.
        run: |
          poetry run alembic upgrade heads
          poetry run alembic downgrade cloud_assembly@base
          poetry run alembic downgrade kernel@base
          poetry run alembic upgrade heads
      - run: make test-integration
